services:
  postgres:
    image: postgres:16-alpine
    container_name: finos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finos
      POSTGRES_USER: finos
      POSTGRES_PASSWORD: finos
    ports:
      - "5432:5432"
    volumes:
      - finos-pgdata:/var/lib/postgresql/data

volumes:
  finos-pgdata:
